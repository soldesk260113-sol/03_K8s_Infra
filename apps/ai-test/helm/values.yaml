# Default values for ai-test.

replicaCount: 1

image:
  repository: 10.2.2.40:5000/library/aitest
  pullPolicy: Always
  tag: "debug-fix4"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "ai-test"

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  hosts:
    - host: ""
      paths:
        - path: /ai(/|$)(.*)
          pathType: ImplementationSpecific
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env:
  - name: OLLAMA_HOST
    value: "http://10.2.2.40:11434"
