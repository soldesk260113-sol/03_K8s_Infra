<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4338ca;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6d28d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#c4b5fd;stop-opacity:0.6" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="900" fill="url(#bgGrad)"/>

  <!-- Hexagonal grid pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="0.8" fill="none">
    <polygon points="100,30 130,47 130,81 100,98 70,81 70,47"/>
    <polygon points="160,30 190,47 190,81 160,98 130,81 130,47"/>
    <polygon points="220,30 250,47 250,81 220,98 190,81 190,47"/>
    <polygon points="280,30 310,47 310,81 280,98 250,81 250,47"/>
    <polygon points="340,30 370,47 370,81 340,98 310,81 310,47"/>
    <polygon points="400,30 430,47 430,81 400,98 370,81 370,47"/>
    <polygon points="460,30 490,47 490,81 460,98 430,81 430,47"/>
    <polygon points="520,30 550,47 550,81 520,98 490,81 490,47"/>
    <polygon points="580,30 610,47 610,81 580,98 550,81 550,47"/>
    <polygon points="640,30 670,47 670,81 640,98 610,81 610,47"/>
    <polygon points="700,30 730,47 730,81 700,98 670,81 670,47"/>
    <polygon points="760,30 790,47 790,81 760,98 730,81 730,47"/>
    <polygon points="820,30 850,47 850,81 820,98 790,81 790,47"/>

    <polygon points="130,81 160,98 160,132 130,149 100,132 100,98"/>
    <polygon points="190,81 220,98 220,132 190,149 160,132 160,98"/>
    <polygon points="250,81 280,98 280,132 250,149 220,132 220,98"/>
    <polygon points="310,81 340,98 340,132 310,149 280,132 280,98"/>
    <polygon points="370,81 400,98 400,132 370,149 340,132 340,98"/>
    <polygon points="430,81 460,98 460,132 430,149 400,132 400,98"/>
    <polygon points="490,81 520,98 520,132 490,149 460,132 460,98"/>
    <polygon points="550,81 580,98 580,132 550,149 520,132 520,98"/>
    <polygon points="610,81 640,98 640,132 610,149 580,132 580,98"/>
    <polygon points="670,81 700,98 700,132 670,149 640,132 640,98"/>
    <polygon points="730,81 760,98 760,132 730,149 700,132 700,98"/>
    <polygon points="790,81 820,98 820,132 790,149 760,132 760,98"/>
    <polygon points="850,81 880,98 880,132 850,149 820,132 820,98"/>

    <polygon points="100,132 130,149 130,183 100,200 70,183 70,149"/>
    <polygon points="160,132 190,149 190,183 160,200 130,183 130,149"/>
    <polygon points="220,132 250,149 250,183 220,200 190,183 190,149"/>
    <polygon points="280,132 310,149 310,183 280,200 250,183 250,149"/>
    <polygon points="340,132 370,149 370,183 340,200 310,183 310,149"/>
    <polygon points="400,132 430,149 430,183 400,200 370,183 370,149"/>
    <polygon points="460,132 490,149 490,183 460,200 430,183 430,149"/>
    <polygon points="520,132 550,149 550,183 520,200 490,183 490,149"/>
    <polygon points="580,132 610,149 610,183 580,200 550,183 550,149"/>
    <polygon points="640,132 670,149 670,183 640,200 610,183 610,149"/>
    <polygon points="700,132 730,149 730,183 700,200 670,183 670,149"/>
    <polygon points="760,132 790,149 790,183 760,200 730,183 730,149"/>
    <polygon points="820,132 850,149 850,183 820,200 790,183 790,149"/>
  </g>

  <!-- Network connection lines -->
  <g stroke="rgba(196,181,253,0.35)" stroke-width="1.2" fill="none">
    <line x1="200" y1="200" x2="450" y2="350"/>
    <line x1="450" y1="350" x2="700" y2="200"/>
    <line x1="700" y1="200" x2="900" y2="400"/>
    <line x1="200" y1="200" x2="150" y2="500"/>
    <line x1="150" y1="500" x2="450" y2="620"/>
    <line x1="450" y1="350" x2="450" y2="620"/>
    <line x1="450" y1="620" x2="750" y2="550"/>
    <line x1="700" y1="200" x2="750" y2="550"/>
    <line x1="900" y1="400" x2="750" y2="550"/>
    <line x1="750" y1="550" x2="850" y2="750"/>
    <line x1="450" y1="620" x2="300" y2="780"/>
    <line x1="300" y1="780" x2="550" y2="820"/>
    <line x1="550" y1="820" x2="850" y2="750"/>
    <line x1="150" y1="500" x2="300" y2="780"/>
    <line x1="200" y1="200" x2="350" y2="120"/>
    <line x1="350" y1="120" x2="700" y2="200"/>
    <line x1="900" y1="400" x2="950" y2="650"/>
    <line x1="950" y1="650" x2="850" y2="750"/>
  </g>

  <!-- Glowing orbs / ambient light -->
  <circle cx="300" cy="300" r="180" fill="rgba(167,139,250,0.08)"/>
  <circle cx="750" cy="600" r="220" fill="rgba(99,102,241,0.07)"/>
  <circle cx="900" cy="200" r="130" fill="rgba(196,181,253,0.06)"/>

  <!-- Main Kubernetes-like hub node -->
  <circle cx="450" cy="350" r="42" fill="rgba(255,255,255,0.12)" stroke="rgba(196,181,253,0.6)" stroke-width="1.5" filter="url(#softGlow)"/>
  <circle cx="450" cy="350" r="22" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <!-- K8s wheel spokes -->
  <g stroke="rgba(255,255,255,0.7)" stroke-width="2" transform="translate(450,350)">
    <line x1="0" y1="-15" x2="0" y2="15"/>
    <line x1="-13" y1="-7.5" x2="13" y2="7.5"/>
    <line x1="-13" y1="7.5" x2="13" y2="-7.5"/>
  </g>
  <circle cx="450" cy="350" r="22" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>

  <!-- Satellite nodes -->
  <!-- Node 1: top-left -->
  <circle cx="200" cy="200" r="28" fill="rgba(255,255,255,0.1)" stroke="rgba(196,181,253,0.5)" stroke-width="1.2" filter="url(#glow)"/>
  <circle cx="200" cy="200" r="14" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <text x="200" y="204" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.85)" font-weight="bold">API</text>

  <!-- Node 2: top-right -->
  <circle cx="700" cy="200" r="28" fill="rgba(255,255,255,0.1)" stroke="rgba(196,181,253,0.5)" stroke-width="1.2" filter="url(#glow)"/>
  <circle cx="700" cy="200" r="14" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <text x="700" y="204" text-anchor="middle" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.85)" font-weight="bold">ETCD</text>

  <!-- Node 3: far-right -->
  <circle cx="900" cy="400" r="24" fill="rgba(255,255,255,0.1)" stroke="rgba(196,181,253,0.5)" stroke-width="1" filter="url(#glow)"/>
  <circle cx="900" cy="400" r="12" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <text x="900" y="404" text-anchor="middle" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.85)" font-weight="bold">WN</text>

  <!-- Node 4: left-mid -->
  <circle cx="150" cy="500" r="22" fill="rgba(255,255,255,0.1)" stroke="rgba(196,181,253,0.4)" stroke-width="1" filter="url(#glow)"/>
  <circle cx="150" cy="500" r="11" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <text x="150" y="503" text-anchor="middle" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.8)">POD</text>

  <!-- Node 5: bottom-center-left -->
  <circle cx="300" cy="780" r="22" fill="rgba(255,255,255,0.1)" stroke="rgba(196,181,253,0.4)" stroke-width="1" filter="url(#glow)"/>
  <circle cx="300" cy="780" r="11" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <text x="300" y="783" text-anchor="middle" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.8)">SVC</text>

  <!-- Node 6: bottom-right -->
  <circle cx="850" cy="750" r="24" fill="rgba(255,255,255,0.1)" stroke="rgba(196,181,253,0.4)" stroke-width="1" filter="url(#glow)"/>
  <circle cx="850" cy="750" r="12" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <text x="850" y="754" text-anchor="middle" font-family="monospace" font-size="7" fill="rgba(255,255,255,0.8)">ING</text>

  <!-- Node 7: bottom-center -->
  <circle cx="550" cy="820" r="20" fill="rgba(255,255,255,0.08)" stroke="rgba(196,181,253,0.35)" stroke-width="1" filter="url(#glow)"/>
  <circle cx="550" cy="820" r="10" fill="url(#nodeGrad)" filter="url(#glow)"/>

  <!-- Node 8: right-bottom -->
  <circle cx="950" cy="650" r="18" fill="rgba(255,255,255,0.08)" stroke="rgba(196,181,253,0.35)" stroke-width="1" filter="url(#glow)"/>
  <circle cx="950" cy="650" r="9" fill="url(#nodeGrad)" filter="url(#glow)"/>

  <!-- Node 9: top connector -->
  <circle cx="350" cy="120" r="18" fill="rgba(255,255,255,0.08)" stroke="rgba(196,181,253,0.35)" stroke-width="1" filter="url(#glow)"/>
  <circle cx="350" cy="120" r="9" fill="url(#nodeGrad)" filter="url(#glow)"/>

  <!-- Bottom center node -->
  <circle cx="450" cy="620" r="26" fill="rgba(255,255,255,0.1)" stroke="rgba(196,181,253,0.5)" stroke-width="1.2" filter="url(#glow)"/>
  <circle cx="450" cy="620" r="13" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <text x="450" y="624" text-anchor="middle" font-family="monospace" font-size="7.5" fill="rgba(255,255,255,0.85)">CM</text>

  <!-- Right-mid node -->
  <circle cx="750" cy="550" r="30" fill="rgba(255,255,255,0.1)" stroke="rgba(196,181,253,0.55)" stroke-width="1.3" filter="url(#glow)"/>
  <circle cx="750" cy="550" r="15" fill="url(#nodeGrad)" filter="url(#glow)"/>
  <text x="750" y="554" text-anchor="middle" font-family="monospace" font-size="8" fill="rgba(255,255,255,0.85)">NS</text>

  <!-- AI Ollama indicator - bottom area decorative text -->
  <g opacity="0.18">
    <rect x="60" y="840" width="120" height="26" rx="13" fill="rgba(255,255,255,0.15)"/>
    <text x="120" y="857" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffffff" font-weight="bold">Ollama + llama3.1</text>
  </g>

  <!-- Data packet animated dots along lines (static positions) -->
  <circle cx="325" cy="275" r="3" fill="rgba(255,255,255,0.6)" filter="url(#glow)"/>
  <circle cx="575" cy="275" r="3" fill="rgba(255,255,255,0.6)" filter="url(#glow)"/>
  <circle cx="800" cy="300" r="3" fill="rgba(255,255,255,0.5)" filter="url(#glow)"/>
  <circle cx="600" cy="485" r="3" fill="rgba(255,255,255,0.5)" filter="url(#glow)"/>
  <circle cx="375" cy="700" r="3" fill="rgba(255,255,255,0.4)" filter="url(#glow)"/>
  <circle cx="700" cy="650" r="3" fill="rgba(255,255,255,0.4)" filter="url(#glow)"/>
  <circle cx="175" cy="350" r="2.5" fill="rgba(255,255,255,0.45)" filter="url(#glow)"/>
  <circle cx="675" cy="375" r="2.5" fill="rgba(255,255,255,0.4)" filter="url(#glow)"/>

  <!-- Subtle bottom gradient overlay -->
  <defs>
    <linearGradient id="bottomFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#5b21b6;stop-opacity:0.4"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="900" fill="url(#bottomFade)"/>
</svg>
