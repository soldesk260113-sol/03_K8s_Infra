<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI + API 기반 사이트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            padding-bottom: 190px;
        }

        /* Container & Layout */
        .container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 40px;
            padding-top: 110px;
        }

        /* Utility */
        .hidden {
            display: none !important;
        }

        /* Login View */
        #loginView {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-shell {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 18px;
        }

        .login-hero {
            border-radius: 22px;
            padding: 38px 40px;
            color: #0f172a;
            background: radial-gradient(1200px 600px at 20% 20%, rgba(124, 58, 237, 0.18), transparent 50%),
                radial-gradient(900px 500px at 80% 10%, rgba(99, 102, 241, 0.18), transparent 55%),
                linear-gradient(135deg, #f8fafc 0%, #eef2ff 45%, #f5f3ff 100%);
            border: 1px solid #e5e7eb;
            box-shadow: 0 10px 30px rgba(2, 6, 23, 0.08);
            position: relative;
            overflow: hidden;
        }

        .login-hero h1 {
            font-size: 34px;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
        }

        .login-hero p {
            font-size: 15px;
            color: #334155;
            line-height: 1.6;
            max-width: 54ch;
        }

        .hero-badges {
            margin-top: 18px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .hero-pill {
            font-size: 12px;
            font-weight: 700;
            color: #4f46e5;
            background: rgba(79, 70, 229, 0.10);
            border: 1px solid rgba(79, 70, 229, 0.22);
            padding: 6px 10px;
            border-radius: 999px;
        }

        .login-panel {
            background: white;
            border: 1px solid #eef2f7;
            border-radius: 22px;
            padding: 30px 26px;
            box-shadow: 0 10px 30px rgba(2, 6, 23, 0.10);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-title {
            font-size: 20px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .login-desc {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 18px;
            line-height: 1.5;
        }

        .login-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .login-field label {
            font-size: 12px;
            font-weight: 700;
            color: #334155;
        }

        .login-input {
            width: 100%;
            padding: 14px 14px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            outline: none;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .login-input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.10);
        }

        .login-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-primary {
            padding: 12px 14px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #7c3aed 0%, #6366f1 100%);
            color: white;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-ghost {
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            background: white;
            color: #334155;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-link {
            border: none;
            background: transparent;
            padding: 10px 0;
            font-size: 13px;
            font-weight: 800;
            color: #7c3aed;
            cursor: pointer;
        }

        .btn-link:hover {
            text-decoration: underline;
        }

        .login-hint {
            margin-top: 12px;
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.5;
        }

        /* Toolbar */
        #toolbar {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 900px;
            background: rgba(255, 255, 255, 0.90);
            backdrop-filter: blur(10px);
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 60;
            box-shadow: 0 6px 20px rgba(2, 6, 23, 0.08);
        }

        .tb-left {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #0f172a;
            font-weight: 900;
        }

        .tb-chip {
            font-size: 12px;
            font-weight: 800;
            color: #7c3aed;
            background: #f5f3ff;
            border: 1px solid #ede9fe;
            padding: 4px 10px;
            border-radius: 999px;
        }

        .tb-center {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 10px;
        }

        .tb-ind {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid #e2e8f0;
            background: rgba(248, 250, 252, 0.8);
            font-size: 12px;
            font-weight: 800;
            color: #0f172a;
            user-select: none;
        }

        .tb-ind .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #94a3b8;
            box-shadow: 0 0 0 2px rgba(148, 163, 184, 0.20);
        }

        .tb-ind.ok .dot {
            background: #22c55e;
            box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.20);
        }

        .tb-ind.bad .dot {
            background: #ef4444;
            box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.20);
        }

        .tb-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tb-btn {
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid #e2e8f0;
            background: white;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            color: #334155;
        }

        .tb-btn:hover {
            border-color: #7c3aed;
            color: #7c3aed;
            background: #f5f3ff;
        }

        /* Guest Bar */
        .guestbar {
            position: sticky;
            top: 12px;
            z-index: 50;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin: 12px auto 0;
            max-width: 900px;
            padding: 0 2px;
        }

        .gbtn {
            border: 1px solid rgba(0, 0, 0, 0.10);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(6px);
            padding: 10px 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .gbtn:hover {
            background: rgba(255, 255, 255, 1);
        }

        /* Quote Card */
        .quote-card {
            background: white;
            border-radius: 16px;
            padding: 30px 40px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .quote-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
        }

        .quote-text {
            font-size: 20px;
            color: #2c3e50;
            font-style: italic;
            margin-bottom: 12px;
        }

        .quote-text::before,
        .quote-text::after {
            content: '"';
            font-size: 28px;
            color: #7c3aed;
            margin: 0 4px;
        }

        .quote-author {
            font-size: 14px;
            color: #64748b;
            font-weight: 500;
        }

        /* Main Section */
        .main-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        .question-input {
            width: 100%;
            padding: 20px 60px 20px 24px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 24px;
            outline: none;
            transition: all 0.3s ease;
        }

        .question-input:focus {
            border-color: #7c3aed;
            box-shadow: 0 6px 12px rgba(124, 58, 237, 0.15);
        }

        .send-button {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed 0%, #6366f1 100%);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .send-button:hover {
            transform: translateY(-50%) scale(1.05);
        }

        .send-button svg {
            width: 20px;
            height: 20px;
        }

        /* Examples */
        .example-questions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .example-btn {
            padding: 10px 20px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            font-size: 14px;
            color: #64748b;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .example-btn:hover {
            border-color: #7c3aed;
            color: #7c3aed;
            background: #f5f3ff;
        }

        /* Response Area */
        .response-area {
            background: white;
            border-radius: 16px;
            padding: 40px;
            min-height: 200px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            color: #94a3b8;
            font-size: 16px;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .response-area.active {
            display: flex;
        }

        .response-content {
            width: 100%;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e2e8f0;
            border-radius: 50%;
            border-top-color: #7c3aed;
            animation: spin 1s infinite linear;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Bottom Info Grid */
        .info-grid {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: 12px;
            width: calc(100% - 40px);
            max-width: 900px;
            z-index: 50;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .info-card {
            background: white;
            border-radius: 14px;
            padding: 12px 14px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid #eef2f7;
            transition: transform 0.2s ease;
        }

        .info-card:hover {
            transform: translateY(-2px);
        }

        .info-title {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
            color: #334155;
        }

        .badge {
            font-size: 12px;
            font-weight: 600;
            color: #7c3aed;
            background: #f5f3ff;
            border: 1px solid #ede9fe;
            padding: 4px 10px;
            border-radius: 999px;
        }

        .info-value {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 4px;
        }

        .info-sub {
            font-size: 12px;
            color: #64748b;
        }

        .mini-muted {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 8px;
        }

        @media (max-width: 900px) {
            .info-grid {
                grid-template-columns: repeat(2, 1fr);
                bottom: 10px;
            }

            .login-shell {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 520px) {
            .info-grid {
                grid-template-columns: 1fr;
            }
        }

        .refresh-row {
            display: none;
        }
    </style>
</head>

<body>
    <!-- Login View -->
    <div id="loginView">
        <div class="login-shell">
            <div class="login-hero">
                <h1>AI + API 기반 사이트</h1>
                <p>날씨 · 전력(KPX) · 환율 · 시간 정보를 한 화면에서 확인하세요.</p>
                <div class="hero-badges"><span class="hero-pill">K8s 기반 통합 관제 UI</span></div>
            </div>
            <div class="login-panel">
                <div class="login-title">로그인</div>
                <div class="login-desc">비회원도 이용 가능합니다.</div>

                <div class="login-field"><label>아이디</label><input class="login-input" id="loginUser"
                        autocomplete="username"></div>
                <div class="login-field"><label>비밀번호</label><input class="login-input" id="loginPass" type="password"
                        autocomplete="current-password"></div>

                <div class="login-actions">
                    <button class="btn-primary" id="btnLogin">로그인</button>
                    <button class="btn-ghost" id="btnGuest">비회원으로 계속</button>
                </div>
                <div class="login-actions" style="justify-content: space-between;">
                    <button class="btn-link" id="btnShowSignup">회원가입</button>
                    <button class="btn-link" id="btnShowReset">비밀번호 재설정</button>
                </div>

                <div id="authExtra" class="hidden"
                    style="margin-top: 14px; border-top: 1px solid #e2e8f0; padding-top: 14px;">
                    <!-- Signup / Reset logic unified in JS -->
                    <div id="extraContent"></div>
                </div>
                <div class="login-hint" id="loginHint">admin/admin123</div>
            </div>
        </div>
    </div>

    <!-- Dashboard View -->
    <div id="dashboardView" class="hidden">
        <div id="toolbar" class="hidden">
            <div class="tb-left"><span>ADMIN</span><span class="tb-chip" id="tbUserChip">user</span></div>
            <div class="tb-center">
                <span class="tb-ind" id="indWeather"><span class="dot"></span>Weather</span>
                <span class="tb-ind" id="indEnergy"><span class="dot"></span>Energy</span>
                <span class="tb-ind" id="indFx"><span class="dot"></span>FX</span>
                <span class="tb-ind" id="indTime"><span class="dot"></span>Time</span>
            </div>
            <div class="tb-right">
                <button class="tb-btn" id="tbRefresh">갱신</button>
                <button class="tb-btn" id="tbLogout">로그아웃</button>
            </div>
            <div id="guestBar" class="guestbar hidden">
                <button class="gbtn" id="guestBack">뒤로</button>
            </div>
        </div>

        <div class="container">
            <div class="quote-card">
                <div class="quote-text" id="quoteText">Loading...</div>
                <div class="quote-author" id="quoteAuthor"></div>
            </div>
            <div class="main-section">
                <div class="input-wrapper">
                    <input type="text" class="question-input" id="questionInput" placeholder="질문을 입력하세요">
                    <button class="send-button" id="sendButton"><svg fill="none" stroke="currentColor"
                            viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                        </svg></button>
                </div>
                <div class="example-questions">
                    <button class="example-btn" data-q="오늘 날씨 알려줘">현재 날씨</button>
                    <button class="example-btn" data-q="전력 사용량 예측해줘">전력 예측</button>
                </div>
            </div>
            <div class="response-area" id="responseArea">
                <div class="response-content" id="responseContent"></div>
            </div>
        </div>

        <div class="info-grid">
            <div class="info-card" id="cardWeather">
                <div class="info-title"><span>현재 날씨</span><span class="badge">Open-Meteo</span></div>
                <div class="info-value" id="weatherValue">—</div>
                <div class="info-sub" id="weatherSub">Loading...</div>
            </div>
            <div class="info-card" id="cardEnergy">
                <div class="info-title"><span>전력(KPX)</span><span class="badge">효율</span></div>
                <div class="info-value" id="energyValue">—</div>
                <div class="info-sub" id="energySub">Loading...</div>
            </div>
            <div class="info-card" id="cardFx">
                <div class="info-title"><span>환율</span><span class="badge">USD/KRW</span></div>
                <div class="info-value" id="fxValue">—</div>
                <div class="info-sub" id="fxSub">Loading...</div>
            </div>
            <div class="info-card" id="cardTime">
                <div class="info-title"><span>시간</span><span class="badge">Seoul</span></div>
                <div class="info-value" id="timeValue">—</div>
                <div class="info-sub" id="timeSub">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        // Utilities
        const $ = (id) => document.getElementById(id);
        const setTxt = (id, txt) => { const el = $(id); if (el) el.textContent = txt; };
        const setCls = (id, cls, on) => { const el = $(id); if (el) el.classList.toggle(cls, on); };

        // Auth Logic
        const AUTH_KEY = "team2_auth";
        const USERS_KEY = "team2_users";
        const getUsers = () => JSON.parse(localStorage.getItem(USERS_KEY) || "{}");
        const saveUsers = (u) => localStorage.setItem(USERS_KEY, JSON.stringify(u));
        const setAuth = (u) => {
            if (u) localStorage.setItem(AUTH_KEY, JSON.stringify(u));
            else localStorage.removeItem(AUTH_KEY);
            updateUI(u);
        };

        function updateUI(auth) {
            setCls("loginView", "hidden", !!auth);
            setCls("dashboardView", "hidden", !auth);
            if (!auth) return;

            const isAdmin = auth.role === "admin";
            setCls("toolbar", "hidden", !isAdmin);
            setCls("guestBar", "hidden", isAdmin);
            setTxt("tbUserChip", auth.user);

            if (isAdmin) refreshWidgets();
        }

        // Event Listeners
        $("btnLogin").onclick = () => {
            const u = $("loginUser").value.trim(), p = $("loginPass").value.trim();
            if (u === "admin" && p === "admin123") return setAuth({ user: u, role: "admin" });

            const users = getUsers();
            if (users[u] && users[u].pass === p) return setAuth({ user: u, role: "user" });
            setTxt("loginHint", "로그인 실패");
        };
        $("btnGuest").onclick = () => setAuth({ user: "guest", role: "guest" });
        $("tbLogout").onclick = $("guestBack").onclick = () => setAuth(null);
        $("tbRefresh").onclick = () => refreshWidgets();

        // Data Fetching Logic
        const API_BASE = (window.__API_BASE || "").replace(/\/$/, "");

        async function fetchData(url) {
            try {
                const res = await fetch(url.startsWith("http") ? url : API_BASE + url);
                return res.ok ? await res.json() : null;
            } catch { return null; }
        }

        async function refreshWidgets() {
            setIndicator("indWeather", await loadWeather());
            setIndicator("indEnergy", await loadEnergy());
            setIndicator("indFx", await loadFx());
            setIndicator("indTime", true); // Time is local
        }

        function setIndicator(id, status) {
            const el = $(id);
            if (!el) return;
            el.className = "tb-ind " + (status ? "ok" : status === false ? "bad" : "");
        }

        async function loadWeather() {
            setTxt("weatherSub", "로딩 중...");
            const data = await fetchData("/api/weather/short?nx=60&ny=127");
            if (data) {
                const temp = data.temp || data.TMP || data.T1H || "—";
                setTxt("weatherValue", `${temp}°C`);
                setTxt("weatherSub", "서울 기준");
                return true;
            }
            setTxt("weatherValue", "Error");
            return false;
        }

        async function loadEnergy() {
            const data = await fetchData("/api/energy/kpx/now?page=1&perPage=1");
            if (data && data.data && data.data[0]) {
                setTxt("energyValue", "연도 " + new Date().getFullYear());
                const row = data.data[0];
                setTxt("energySub", `서울 ${row["서울"] || "-"} · 부산 ${row["부산"] || "-"}`);
                return true;
            }
            setTxt("energyValue", "No Data");
            return false;
        }

        async function loadFx() {
            // Try internal then external
            let data = await fetchData("/api/fx/usdkrw");
            if (!data) data = await fetchData("https://open.er-api.com/v6/latest/USD");

            const rate = data ? (data.rate || data.usdkrw || (data.rates && data.rates.KRW)) : null;
            if (rate) {
                setTxt("fxValue", Number(rate).toFixed(2));
                setTxt("fxSub", "USD 1 = KRW " + Number(rate).toFixed(2));
                return true;
            }
            setTxt("fxValue", "Error");
            return false;
        }

        // Timer
        setInterval(() => {
            const now = new Date();
            setTxt("timeValue", now.toLocaleTimeString("ko-KR", { hour12: false, hour: "2-digit", minute: "2-digit" }));
            setTxt("timeSub", now.toLocaleDateString("ko-KR"));
        }, 1000);

        // Quotes & Input
        const quotes = [{ text: "Simple is Best", author: "Unknown" }];
        setTxt("quoteText", quotes[0].text);
        setTxt("quoteAuthor", quotes[0].author);

        $("sendButton").onclick = () => {
            const q = $("questionInput").value.trim();
            if (!q) return;
            $("responseArea").classList.add("active");
            $("responseContent").innerHTML = "분석 중...";
            setTimeout(() => $("responseContent").innerHTML = `답변: ${q}에 대한 정보입니다.`, 1000);
        };

        // Init
        const savedAuth = JSON.parse(localStorage.getItem(AUTH_KEY));
        if (savedAuth && savedAuth.role === "admin") updateUI(savedAuth); // Auto login admin only
        else updateUI(null);

    </script>
