---
- name: Ensure Docker is installed (via common role dependency or direct task)
  include_role:
    name: common
    tasks_from: docker.yml

- name: Allow web traffic in firewalld
  firewalld:
    port: "{{ web_host_port }}/tcp"
    permanent: true
    state: enabled
    immediate: true
  ignore_errors: true

- name: Synchronize web application source
  synchronize:
    src: "{{ web_src_dir }}/"
    dest: "{{ web_dest_dir }}/"
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=node_modules"
      - "--exclude=dist"

- name: Build web application image
  docker_image:
    name: "{{ web_image_name }}"
    tag: "{{ web_image_tag }}"
    path: "{{ web_dest_dir }}"
    source: build
    buildargs:
      VITE_APP_ID: "{{ vite_app_id }}"
    force_source: true

- name: Stop and remove existing web container
  docker_container:
    name: "{{ web_container_name }}"
    state: absent

- name: Run web application container
  docker_container:
    name: "{{ web_container_name }}"
    image: "{{ web_image_name }}:{{ web_image_tag }}"
    state: started
    restart_policy: unless-stopped
    ports:
      - "{{ web_host_port }}:{{ web_container_port }}"
    env:
      DATABASE_URL: "{{ database_url }}"
      JWT_SECRET: "{{ jwt_secret }}"
      GOOGLE_CLIENT_SECRET: "{{ google_client_secret }}"
      VITE_DEV_LOGIN: "{{ vite_dev_login }}"

- name: Web service health check
  uri:
    url: "http://localhost:{{ web_host_port }}"
    status_code: 200
  register: result
  until: result.status == 200
  retries: 5
  delay: 5

